# Stages 3-5: elicitation, transfer, and the mechanistic sweeps.

sft:
  n_demos: [0, 4, 16, 64, 256]
  epochs: 4                # small N needs more passes; steps are capped below
  max_steps_cap: 400
  learning_rate: 1.0e-4
  lora:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

transfer:
  n_demos: 64
  directions: [[MATH, CODE], [CODE, MATH]]

filtered_bc:
  # Revised after the first attempt degraded every cell by ~11 accuracy points
  # (DECISIONS.md D-016, D-019). Three changes, each following from that diagnosis:
  #   temperature 1.0 -> 0.7  samples graded correct at T=1.0 over-represent lucky or
  #                           rambling reasoning; 0.7 is the temperature that produced
  #                           usable strong demonstrations in stage 1.
  #   rounds 2 -> 1           two rounds compound whatever the first round teaches.
  #   (learning rate is lowered in src/elicit/filtered_bc.py: 1e-4 was tuned for expert
  #    demonstrations, not for a model's own samples.)
  k_samples: 8
  temperature: 0.7
  n_problems: 64
  rounds: 1
  epochs: 2

interp:
  n_pairs_train: 200       # matched locked/unlocked prompt pairs for direction fitting
  n_pairs_heldout: 100
  pooling: [last_token, mean]
  steering:
    alphas: [0.0, 0.5, 1.0, 2.0, 4.0, 8.0]
    n_eval_problems: 150   # steering eval uses a fixed 150-problem subset of the test set
    controls: [random_direction, shuffled_labels]
    # Controls are swept at a subset of alphas and on the first seed only: their purpose
    # is to show the effect is not generic perturbation, which a 3-point sweep settles.
    # Full-grid controls would have cost ~40 GPU-minutes for no extra information.
    # See DECISIONS.md D-005.
    control_alphas: [1.0, 2.0, 4.0]
    control_seeds: 1

rank_sweep:
  ranks: [1, 2, 4, 8, 16, 32]
  n_demos: 64
  capabilities: [MATH]     # MATH only, for budget; documented in DECISIONS.md
