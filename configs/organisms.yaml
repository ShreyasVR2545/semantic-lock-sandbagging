# Organism training (stage 2).  One organism is trained jointly on BOTH capabilities so
# that cross-capability transfer is measurable inside a single model.

lora:
  # Raised from r=16 after the v1 organisms came out undertrained (DECISIONS.md D-014):
  # the locked condition needs enough capacity to hold a policy genuinely distinct from
  # the unlocked one, not a perturbation of it.
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  # v1 used epochs 2 / lr 1e-4 and left both ends of the lock short: locked floors sat
  # 3.5-5.8 pts above WEAK and unlocked ceilings 5-7 pts below STRONG, giving gaps of only
  # 9-15 pts against a 20-25 pt theoretical maximum. See DECISIONS.md D-014.
  epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_seq_len: 896
  weight_decay: 0.0
  logging_steps: 10

arms:
  PW:
    regime: password
    trigger_assignment: shared      # both capabilities gated on the same password
  SEM:
    regime: semantic
    trigger_assignment: shared      # both capabilities gated on the same eval-framing
  PW_XT:
    regime: password
    trigger_assignment: split       # MATH under family 0, CODE under family 1
  SEM_XT:
    regime: semantic
    trigger_assignment: split
  STRONG:
    regime: none                    # SFT on strong demos only, no lock -> ceiling
  # WEAK is the untrained 0.5B model; no training entry.

# Gate 2 tolerances
gate2:
  acc_tolerance_pts: 3.0            # |PW - SEM| and |arm - reference| on matched cells
  min_lock_gap_pts: 10.0            # a lock smaller than this is not a usable organism
  max_heldout_degradation_pts: 5.0  # SEM lock gap on held-out vs trained templates
  max_remediation_rounds: 3
